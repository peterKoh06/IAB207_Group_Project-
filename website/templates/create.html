  {% block header %}

    <body>


    <!--the navbar header with all the important stuff and gunk-->

        <div class="container-fluid">
          <a class="navbar-brand" href="#">The Mixer Port</a>

         <!-- The navbar's Brand Image-->
         <a class="navbar-brand" href="#">
           <img src="./static/img/The Mixer.svg" alt="Mixer Icon" width="30" height="24">
           </a>

          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
             <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">


              <!-- CHANGE HREFS TO THE OTHER PLACES BEFORE SUBMITTING!!!!! -->

               <a class="nav-link" href="./history.html">History</a>
                
               <a class="nav-link" href="create.html">Create Event</a>


                <button type="button" class="btn btn-primary position-absolute end-0" data-bs-toggle="modal" data-bs-target="#loginModal">
                  Login
                </button>

                <!-- Login Area -->
                <div class="modal slide" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
                  <div class="modal-dialog">
                    <div class="modal-content">

                      <div class="modal-header">
                        <h5 class="modal-title fs-5" id="loginModal">Log in</h5>
                      </div>
                      
                      
                      <div class="modal-body">
                        <form>
                          <div class="mb-3">
                            <label for="loginDetailsEmail" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="loginDetailsEmail" aria-describedby="emailHelp">
                            <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
                          </div>
                          <div class="mb-3">
                            <label for="loginDetailsPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="loginDetailsPassword">
                          </div>
                          <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="exampleCheck1">
                            <label class="form-check-label" for="exampleCheck1">Remember Details</label>
                          </div>
                          <button type="button" class="btn btn-secondary">Create Account</button>
                        </form>
                      </div>

                      <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Log in</button>
                      </div>
                    </div>
                  </div>
                </div>

            </div>
          </div>
        </div>
      </nav>


      <h2>Create New Event</h2>


      <div class="container">

        <div class="row-cols-1">
            <form>
                <label for="eventTitle" class="form-label" >Event Name</label>
                <input type="text" id="eventTitle" class="form-control">

                <label for="eventDate" class="form-label" >Date of Event</label>
                <input type="date" id="eventDate" class="form-control">

                <label for="eventDescription" class="form-label">Description of Event</label>
                <textarea type="text" id="eventDescription" class="form-control" rows="10"></textarea>

                <label for="eventLocation" class="form-label">Location</label>
                <input type="text" id="eventLocation" class="form-control">


            </form>



            
        </div>

        <br>

        <div class="row row-cols-md-2 row-cols-sm-1 row-cols-xs-1">

        <div class="column">
        <h3>Offerings</h3>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="alcoholCheck">
            <label class="form-check-label" for="alcoholCheck">
                Alcohol
            </label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="seafoodCheck">
            <label class="form-check-label" for="seafoodCheck">
                Seafood
            </label>
        </div>
        </div>


        <div class="column">
        <label for="ticketNumbers"><h3>Number of Tickets Allotted</h3></label>
        <input class="form-control" type="number">

        <br>

        <label for="eventImage"><h3>Event Thumbnail</h3></label> <br>
        <input type="file" id="eventImage">
        </div>

        </div>

        <label>Acknowledgement of Country</label>
            <select class="form-select" aria-label="acknowledgementOptions">
                <option selected value="1">No Acknowledgement Provided</option>
                <option value="2">Generic Acknowledgement Provided</option>
                <option value="3">Advanced Acknowledgement Provided</option>

             </select>


        <br>

        <!-- Add Submit Button / Confirmation Modal--> 
      <a class="btn btn-primary">Submit</a>

      </div>






      
    <!-- Footer -->
    <div class="container-fluid" style="padding:0;margin:0">
      
    <footer class="d-flex flex-row  justify-content-between align-items-center py-3  my-4 mb-3 border-top">
    <p class="col-md-4 mb-0 text-muted">(Copyright, The Mixer Port 2026)</p>

      <li class="nav-item"><a href="./payment.html" class="nav-link px-2 text-muted">Payment</a></li>
      <li class="nav-item"><a href="./create.html" class="nav-link px-2 text-muted">Create</a></li>
    </ul>



    </footer>
    </div>
    </body>





</html>
